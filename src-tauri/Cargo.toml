[package]
name = "squire"
version = "0.1.0"
description = "Squire: Knick Knack Sack — free, open-source inventory and collection manager"
authors = ["sirgijoe"]
license = "GPL-3.0-only"
repository = "https://github.com/sirgijoe/squire-sack"
edition = "2021"

[lib]
name = "squire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
